<div class="rounded-xl border border-slate-800 bg-slate-950 p-4">
  <div class="flex items-start justify-between gap-4">
    <div>
      <div class="text-xs uppercase tracking-wide text-slate-500">Selected Chunk {{ index() + 1 }}</div>
      <div class="mt-1 text-sm font-semibold text-white">{{ title() }}</div>
    </div>
    <div class="rounded-full border border-cyan-500/20 bg-cyan-500/10 px-2.5 py-1 text-[11px] font-medium text-cyan-200">
      {{ chunkId() }}
    </div>
  </div>

  <p class="mt-3 text-sm leading-6 text-slate-300">{{ excerpt() }}</p>

  @if (score() !== null) {
    <div class="mt-3 text-xs text-slate-500">Relevance {{ score() }}</div>
  }
</div>
