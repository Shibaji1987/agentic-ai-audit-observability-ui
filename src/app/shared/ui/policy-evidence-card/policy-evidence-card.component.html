<div class="rounded-xl border border-slate-800 bg-slate-950 p-4">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div class="min-w-0 flex-1">
      <div class="text-xs uppercase tracking-wide text-slate-500">Selected Chunk {{ index() + 1 }}</div>
      <div class="mt-1 text-sm font-semibold text-white">{{ title() }}</div>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      @if (formattedScore(); as displayScore) {
        <div
          class="border border-emerald-500/30 bg-emerald-500/10 px-2.5 py-1 text-xs font-semibold text-emerald-200"
          title="Cosine similarity between the audit-event query embedding and this policy chunk">
          {{ displayScore }} match
        </div>
      }
      <div class="max-w-48 truncate border border-cyan-500/20 bg-cyan-500/10 px-2.5 py-1 text-[11px] font-medium text-cyan-200" [title]="chunkId()">
        {{ chunkId() }}
      </div>
    </div>
  </div>

  <p class="mt-3 text-sm leading-6 text-slate-300">{{ excerpt() }}</p>

  @if (normalizedScore() !== null) {
    <div class="mt-4">
      <div class="mb-1.5 flex items-center justify-between text-xs">
        <span class="text-slate-500">Semantic retrieval score</span>
        <span class="font-medium text-slate-300">Rank #{{ index() + 1 }}</span>
      </div>
      <div class="h-1.5 overflow-hidden bg-slate-800" role="meter" aria-label="Semantic retrieval score" aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="normalizedScore()">
        <div class="h-full bg-emerald-400" [style.width.%]="normalizedScore()"></div>
      </div>
    </div>
  }
</div>
